<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div id="calc-box">
        <div id="screen-box">
            <p id="screen-text"></p>
        </div>
        <div id="special-buttons">
            <button class="calc-button">CLEAR</button>
            <button class="calc-button">BACK</button>
        </div>
        <div id="buttons-box">
            <div id="numpad" class="buttons-column">
                <div class="buttons-row">
                    <button class="calc-button">7</button>
                    <button class="calc-button">8</button>
                    <button class="calc-button">9</button>
                </div>
                <div class="buttons-row">
                    <button class="calc-button">4</button>
                    <button class="calc-button">5</button>
                    <button class="calc-button">6</button>
                </div>
                <div class="buttons-row">
                    <button class="calc-button">1</button>
                    <button class="calc-button">2</button>
                    <button class="calc-button">3</button>
                </div><div class="buttons-row">
                    <button class="calc-button double-space">0</button>
                    <button class="calc-button">.</button>
                </div>
            </div>
            <div class="buttons-column">
                <button class="calc-button">/</button>
                <button class="calc-button">*</button>
                <button class="calc-button">-</button>
                <button class="calc-button">+</button>
            </div>
            <div class="buttons-column">
                <button class="calc-button">(</button>
                <button class="calc-button">)</button>
                <button class="calc-button double-space">=</button>
            </div>
        </div>
    </div>
</body>
</html>
